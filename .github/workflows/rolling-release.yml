name: rolling-release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # build the release artifacts
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      is_rolling: true
