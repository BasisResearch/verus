# The SMT solver builds this Verus is pinned to: the single source of truth.
#
# Every consumer derives from this file, so a bump is one edit:
#   * tools/common/consts.rs   -> the version strings rust_verify and vargo
#                                 check a running solver against
#   * source/tools/get-z3.sh, get-z3.ps1, get-cvc5.sh
#                              -> what the build scripts download
#   * `verus --version --output-json`
#                              -> publishes this table, so verus-tools-mcp
#                                 downloads and hash-checks exactly these
#                                 binaries without carrying a copy of the pin
#
# Format: flat `key = "value"` pairs under a `[solver]` table, parsed by the
# few-line reader in consts.rs (no toml crate needed). Keep it that simple.
#
# `version` is the string the binary prints (`z3 --version` / `cvc5
# --version`); `repo`/`tag` name the GitHub release of the Basis fork built
# by its basis-build workflow, and the asset/sha256 pairs are its stripped
# per-platform binaries.

[z3]
# Built from the z3-4.16.0 tag on the fork's `basis` branch.
version = "4.16.0"
repo = "BasisResearch/z3"
tag = "basis-ce02dc1e6e"
asset_arm64_macos = "z3-arm64-macos"
sha256_arm64_macos = "8678aff7aae763ab69a5079e95562b6abb637bc5245b1bb6de8986c1de2596ab"
asset_x86_linux = "z3-x86-linux"
sha256_x86_linux = "99f5433928fa62adc3a19207d97b14111d62964e26b10b37d286f9e641e0dfbf"

[cvc5]
# Fork `main` at b905873c8d: carries `:assert-id` provenance tags through
# preprocessing, answers `(get-assertion-sources)`, saves, restores, exports
# and imports quantifier instantiations (resident certificates), lists what
# the e-graph holds after a check (`(get-egraph-equalities)`), reports
# matching loops, per-quantifier instantiation pressure, per-assertion
# difficulty, why a check gave up (`:incomplete-id`, its culprit
# quantifiers), the nonlinear terms refinement could not settle
# (`:nl-frontier`) and what the last check-sat cost (`:check-effort`)
# through `(get-info ...)`, and records the instantiation graph of a check
# (`--inst-graph`, `(get-instantiation-graph)`).
version = "1.3.5.dev+main@b905873"
repo = "BasisResearch/cvc5"
tag = "basis-b905873c8d"
asset_arm64_macos = "cvc5-arm64-macos"
sha256_arm64_macos = "a7d1e75e26223e2d6c9c46c54e0d563cdf5bc575ba1cd740802b7e65b0e26d50"
asset_x86_linux = "cvc5-x86-linux"
sha256_x86_linux = "749e13d17001ab5f07a620c382a4fc1ae15b07ef338207830d8df65101c5f78b"
