\* Trace validation: TLC follows the log named by TraceLog. On a well-formed log
\* it ends with no error either way (a malformed one stops at an Assert); the trace conforms when some state reaches TraceAccepted
\* (the depth of the search is the number of logged steps plus one). Depth d
\* below that means logged step d diverged; depth 0 (no initial state) means
\* the header's observed state is not an initial state of the model.
INIT TraceInit
NEXT TraceNext
CHECK_DEADLOCK FALSE
CONSTANT TraceLog = "trace.ndjson"
\* The export's CONSTANTS, if it has any, are needed here too, and each Dom_
\* constant must cover every value the log carries for it: selected arms
\* retain their parameter domains, so a logged value outside one
\* diverges (the step shows as not enabled in TraceDiagnosis).
