\* Init never assigns hosts: TLC cannot compute the initial states ("current state
\* is not a legal state"; see the .tla.json init_unassigned)
\* The unassigned check counts a conjunct-level v' = e, and v = e in Init (an IF,
\* match or disjunction when every branch assigns v; a FALSE branch assigns all;
\* g => b1 beside ~g => b2 when b1 and b2 both assign v).
\* It can miss a v' read before the conjunct that assigns it (TLC evaluates
\* conjuncts in order), and it does not count v' \in S.
\* CONSTRAINT <a state predicate bounding the model>
