<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f6f8f7; --surface: #ffffff; --ink: #1c2522; --muted: #60706a; --line: #d8dfdb;
  --accent: #1f6f8b; --accent-ink: #ffffff;
  --good: #2e7d4f; --good-bg: #dff0e5; --warn: #b7791f; --warn-bg: #f6ead2;
  --bad: #b93a32; --bad-bg: #f6dfdd; --unv: #3d63b8; --unv-bg: #dfe6f6;
  --gutter: #f0f3f1;
  --kw: #7a3e9d; --vk: #1f6f8b; --str: #9a4b1e; --com: #7a8580; --num: #1d5fa5; --attr: #8a6d1f; --mac: #a04a2f; --ty: #2f5f8f; --lt: #a04a2f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131917; --surface: #1b2320; --ink: #e5ebe8; --muted: #96a59e; --line: #2c3733;
    --accent: #6fc3dc; --accent-ink: #0f1a1e;
    --good: #5fc084; --good-bg: #1d3b2a; --warn: #e0a84a; --warn-bg: #3f3117;
    --bad: #ee7a70; --bad-bg: #44231f; --unv: #86a4ee; --unv-bg: #22304f;
    --gutter: #161d1a;
    --kw: #c792ea; --vk: #6fc3dc; --str: #e6a06b; --com: #7f8c86; --num: #82aaff; --attr: #d6c27a; --mac: #f0917f; --ty: #89b4e8; --lt: #f0917f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131917; --surface: #1b2320; --ink: #e5ebe8; --muted: #96a59e; --line: #2c3733;
  --accent: #6fc3dc; --accent-ink: #0f1a1e;
  --good: #5fc084; --good-bg: #1d3b2a; --warn: #e0a84a; --warn-bg: #3f3117;
  --bad: #ee7a70; --bad-bg: #44231f; --unv: #86a4ee; --unv-bg: #22304f;
  --gutter: #161d1a;
  --kw: #c792ea; --vk: #6fc3dc; --str: #e6a06b; --com: #7f8c86; --num: #82aaff; --attr: #d6c27a; --mac: #f0917f; --ty: #89b4e8; --lt: #f0917f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding-inline: 24px; padding-block: 28px 48px;
  background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
}
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, th:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 1.45rem; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
.mono, .num, td.num, .src { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
header { display: flex; flex-direction: column; gap: 10px; }
header .meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 0.85rem; }
header .meta dt { color: var(--muted); }
header .meta dd { margin: 0; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.tile .v { font-size: 1.7rem; font-weight: 500; line-height: 1.1; }
.tile .s { font-size: 0.82rem; color: var(--muted); }
.tile .v.hi { color: var(--good); } .tile .v.med { color: var(--warn); } .tile .v.lo { color: var(--bad); }
.scope { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; }
.scope .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.scope button { font: inherit; font-size: 0.82rem; padding: 4px 12px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.scope button + button { border-left: 1px solid var(--line); }
.scope button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.scope button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.82rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line); }
.legend .vr::before { background: var(--good-bg); border-color: var(--good); }
.legend .vd::before { background: var(--bad-bg); border-color: var(--bad); }
.legend .ur::before { background: var(--unv-bg); border-color: var(--unv); }
.legend .uu::before { background: var(--surface); }
nav.crumbs { font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
nav.crumbs .sep { color: var(--muted); }
nav.crumbs .here { font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tablewrap { overflow-x: auto; }
table.cov { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.cov th, table.cov td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.cov th + th, table.cov td + td { border-left: 1px solid var(--line); }
table.cov th { font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--gutter); cursor: pointer; user-select: none; }
table.cov th.sorted { color: var(--ink); }
table.cov th .dir { font-size: 0.65rem; margin-left: 4px; }
table.cov td.num, table.cov th.num { text-align: right; }
table.cov td.metric, table.cov th.metric { text-align: left; width: 1%; }
table.cov tfoot td { font-weight: 600; background: var(--gutter); border-top: 2px solid var(--line); white-space: normal; }
table.cov tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--gutter) 50%, transparent); }
table.cov td.name { width: 100%; white-space: normal; overflow-wrap: anywhere; }
table.cov tbody tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.cell { display: grid; grid-template-columns: 96px 4.5ch 10ch; align-items: center; gap: 10px; }
.bar { width: 96px; height: 9px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); }
.bar i.hi { background: var(--good); } .bar i.med { background: var(--warn); } .bar i.lo { background: var(--bad); }
.pct { text-align: right; }
.pct.hi { color: var(--good); } .pct.med { color: var(--warn); } .pct.lo { color: var(--bad); }
.frac { color: var(--muted); font-size: 0.8rem; text-align: right; }
.state { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 0.75rem; font-weight: 500; border: 1px solid var(--line); }
.state.vr { background: var(--good-bg); color: var(--good); border-color: transparent; }
.state.vd { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.state.ur { background: var(--unv-bg); color: var(--unv); border-color: transparent; }
.state.uu { color: var(--muted); }
.mode { font-size: 0.78rem; color: var(--muted); }
.src { font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
.ln { display: flex; white-space: pre; min-width: max-content; }
.ln .n { flex: none; width: 6ch; text-align: right; padding-right: 10px; color: var(--muted); user-select: none; background: var(--gutter); border-right: 1px solid var(--line); }
.ln .c { padding-inline: 14px; flex: 1; }
.ln.vr .c { background: var(--good-bg); } .ln.vd .c { background: var(--bad-bg); } .ln.ur .c { background: var(--unv-bg); }
.ln.vr .n { box-shadow: inset 3px 0 var(--good); } .ln.vd .n { box-shadow: inset 3px 0 var(--bad); } .ln.ur .n { box-shadow: inset 3px 0 var(--unv); }
.ln:target .c { outline: 2px solid var(--accent); outline-offset: -2px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.note { font-size: 0.85rem; color: var(--muted); }
.t-kw { color: var(--kw); } .t-vk { color: var(--vk); font-weight: 500; } .t-str { color: var(--str); } .t-com { color: var(--com); font-style: italic; }
.t-num { color: var(--num); } .t-attr { color: var(--attr); } .t-mac { color: var(--mac); } .t-ty { color: var(--ty); } .t-lt { color: var(--lt); }
@media (max-width: 640px) {
  body { padding-inline: 16px; }
  .cell { grid-template-columns: 60px 4.5ch 10ch; }
  .bar { width: 60px; }
  header .meta { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 240ms ease-out; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="reach-data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("reach-data").textContent);
  var HI = 90, MED = 75; // genhtml's default high/medium limits

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function pct(a, b) { return b ? Math.floor(100 * a / b) : null; }
  function band(p) { return p === null ? "" : p >= HI ? "hi" : p >= MED ? "med" : "lo"; }
  function bandInv(p) { return p === null ? "" : p <= 100 - HI ? "hi" : p <= 100 - MED ? "med" : "lo"; }
  function state(f) { return f.verified ? (f.reachable ? "vr" : "vd") : (f.reachable ? "ur" : "uu"); }
  var STATE_LABEL = { vr: "verified, reachable", vd: "verified, dead", ur: "reachable, unverified", uu: "unreachable, unverified" };
  if (DATA.dynamic) STATE_LABEL = { vr: "verified, true reachable", vd: "verified, not true reachable", ur: "reachable, unverified", uu: "unreachable, unverified" };
  var STATE_ORDER = { vd: 0, ur: 1, vr: 2, uu: 3 };

  // What the counts range over: every function, or exec functions only.
  // Reachability itself never changes: spec and proof functions still carry
  // the edges the tool followed; they just leave the numerators and
  // denominators.
  var scope = "all";
  try { scope = localStorage.getItem("verus-reach-scope") === "exec" ? "exec" : "all"; } catch (e) {}
  function inScope(f) { return scope === "all" || f.mode === "exec"; }

  function stats(all) {
    var fns = all.filter(inScope);
    var s = { verified: 0, vreach: 0, reach: 0, fns: fns.length, exec: [0, 0], spec: [0, 0], proof: [0, 0] };
    fns.forEach(function (f) {
      if (f.reachable) s.reach++;
      if (f.verified) {
        s.verified++;
        if (f.reachable) s.vreach++;
        var m = s[f.mode];
        if (m) { m[1]++; if (f.reachable) m[0]++; }
      }
    });
    s.dead = pct(s.verified - s.vreach, s.verified);
    s.share = pct(s.vreach, s.reach);
    s.all = pct(s.vreach, s.fns);
    return s;
  }

  var FILES, TOTAL, VERIFIED_FILES;
  function compute() {
    FILES = (DATA.files || [DATA.file]).map(function (f) {
      return { path: f.path, href: f.href, functions: f.functions, source: f.source, s: stats(f.functions) };
    });
    var totals = DATA.totals || null;
    TOTAL = totals ? totals[scope] : stats([].concat.apply([], FILES.map(function (f) { return f.functions; })));
    VERIFIED_FILES = FILES.filter(function (f) { return f.s.verified > 0; });
  }
  compute();

  // ---- rendering helpers
  function barCell(p, cls, a, b) {
    return '<div class="cell"><span class="bar"><i class="' + cls + '" style="width:' + (p === null ? 0 : p) + '%"></i></span>' +
      '<span class="pct ' + cls + '">' + (p === null ? "–" : p + "%") + '</span>' +
      '<span class="frac">' + a + " / " + b + '</span></div>';
  }

  var COLS = [
    { key: "name", label: "Name" },
    { key: "dead", label: "Dead verified", title: "verified functions nothing reaches / verified functions", metric: true,
      cell: function (s) { return barCell(s.dead, bandInv(s.dead), s.verified - s.vreach, s.verified); } },
    { key: "share", label: "Verified share", title: "reachable verified functions / reachable functions", metric: true,
      cell: function (s) { return barCell(s.share, band(s.share), s.vreach, s.reach); } },
    { key: "all", label: "Verified reachable of all", title: "reachable verified functions / all functions in the file", metric: true,
      cell: function (s) { return barCell(s.all, band(s.all), s.vreach, s.fns); } },
    { key: "fns", label: "Functions", num: true, cell: function (s) { return s.fns; } }
  ];

  var sort = { key: "name", dir: 1 };
  function sortRows(rows) {
    var k = sort.key;
    return rows.slice().sort(function (x, y) {
      var a = k === "name" ? x.name : x.s[k], b = k === "name" ? y.name : y.s[k];
      if (a === null) a = -1; if (b === null) b = -1;
      var c = a < b ? -1 : a > b ? 1 : 0;
      return c ? c * sort.dir : (x.name < y.name ? -1 : 1);
    });
  }

  function table(rows, link, total, totalLabel) {
    var h = '<div class="panel"><div class="tablewrap"><table class="cov"><thead><tr>';
    var cls = function (c) { return (c.num ? "num " : c.metric ? "metric " : "name "); };
    COLS.forEach(function (c) {
      var sorted = sort.key === c.key;
      h += '<th tabindex="0" data-key="' + c.key + '" class="' + cls(c) + (sorted ? "sorted" : "") + '"' +
        (c.title ? ' title="' + esc(c.title) + '"' : "") + '>' + c.label +
        (sorted ? '<span class="dir">' + (sort.dir > 0 ? "▲" : "▼") + '</span>' : "") + '</th>';
    });
    h += '</tr></thead><tbody>';
    sortRows(rows).forEach(function (r) {
      h += '<tr><td class="name"><a href="' + link(r) + '">' + esc(r.name) + '</a></td>';
      COLS.slice(1).forEach(function (c) { h += '<td class="' + cls(c) + '">' + c.cell(r.s) + '</td>'; });
      h += '</tr>';
    });
    h += '</tbody>';
    if (total) {
      h += '<tfoot><tr><td class="name">' + esc(totalLabel) + '</td>';
      COLS.slice(1).forEach(function (c) { h += '<td class="' + cls(c) + '">' + c.cell(total) + '</td>'; });
      h += '</tr></tfoot>';
    }
    return h + '</table></div></div>';
  }

  function crumbs(parts) {
    var h = '<nav class="crumbs">';
    parts.forEach(function (p, i) {
      if (i) h += '<span class="sep">›</span>';
      h += p.href ? '<a href="' + p.href + '">' + esc(p.label) + '</a>' : '<span class="here">' + esc(p.label) + '</span>';
    });
    return h + '</nav>';
  }

  function header() {
    var modes = (scope === "all" ? ["exec", "spec", "proof"] : ["exec"]).map(function (m) {
      return m + " " + (TOTAL[m][1] - TOTAL[m][0]) + "/" + TOTAL[m][1];
    }).join(" · ");
    var roots = DATA.roots.length > 6 ? DATA.roots.length + " functions" : DATA.roots.join(", ");
    var h = '<header><h1>' + esc(DATA.title) + '</h1><dl class="meta">' +
      '<dt>Crates</dt><dd>' + esc(DATA.crates.join(", ")) + '</dd>' +
      '<dt>Roots</dt><dd class="mono">' + esc(roots) + '</dd>' +
      '<dt>Sources</dt><dd class="mono">' + esc(DATA.src_root) + '</dd>' +
      (DATA.dynamic ? '<dt>Dynamic</dt><dd>a verified exec function is reachable only when it is <b>true verified reachable</b>: it ran on the workload, its precondition was never false, and it was never tainted by a false trusted ensures or assume; spec and proof functions and unverified code keep their static reachability</dd>' : '') +
      '</dl></header>';
    h += '<div class="scope"><span class="label">Counting</span><span class="seg">' +
      '<button type="button" id="scope-all" data-scope="all" aria-pressed="' + (scope === "all") + '">exec + ghost</button>' +
      '<button type="button" id="scope-exec" data-scope="exec" aria-pressed="' + (scope === "exec") + '">exec only</button></span>' +
      '<span class="muted">' + (scope === "all" ? "spec and proof functions count as verified code" : "spec and proof functions are left out of every count; reachability is unchanged") + '</span></div>';
    h += '<div class="tiles">' +
      tile("Dead verified", TOTAL.dead, bandInv(TOTAL.dead), (TOTAL.verified - TOTAL.vreach) + " of " + TOTAL.verified + " verified functions nothing reaches · " + modes) +
      tile("Verified share of reachable code", TOTAL.share, band(TOTAL.share), TOTAL.vreach + " of " + TOTAL.reach + " reachable functions are verified") +
      tile("Verified reachable of all functions", TOTAL.all, band(TOTAL.all), TOTAL.vreach + " of " + TOTAL.fns + " functions are verified and reachable") +
      '</div>';
    h += '<div class="legend"><span class="vr">verified and reachable</span><span class="vd">verified but nothing reaches it</span>' +
      '<span class="ur">reachable but unverified</span><span class="uu">neither</span>' +
      '<span class="muted">bars: green ≥ ' + HI + '%, amber ≥ ' + MED + '%, red below (genhtml limits)</span></div>';
    return h;
  }
  function tile(k, p, cls, sub) {
    return '<div class="tile"><span class="label">' + k + '</span><span class="v num ' + cls + '">' + (p === null ? "–" : p + "%") + '</span><span class="s">' + esc(sub) + '</span></div>';
  }

  // ---- views
  function viewFiles() {
    var rows = VERIFIED_FILES.map(function (f) { return { name: f.path, s: f.s, href: f.href }; });
    var others = DATA.file_count - VERIFIED_FILES.length;
    var totalLabel = "Total, all " + DATA.file_count + " files";
    return '<div class="section"><div class="section-head"><h2>Files with verified code</h2><span class="note">' +
      VERIFIED_FILES.length + ' of ' + DATA.file_count + ' files' +
      (others ? '; the other ' + others + ' hold reachable code but nothing verified and count only in the totals' : '') + '</span></div>' +
      table(rows, function (r) { return encodeURI(r.href); }, TOTAL, totalLabel) + '</div>';
  }
  function viewFile() {
    var f = FILES[0];
    var h = crumbs([{ label: "Files with verified code", href: DATA.up + "/index.html" }, { label: f.path }]);
    h += '<div class="section"><div class="section-head"><h2>' + esc(f.path) + '</h2></div>' +
      table([{ name: f.path, s: f.s, href: "" }], function () { return "#"; }, TOTAL, "Total, all " + DATA.file_count + " files") + '</div>';
    var fns = f.functions.slice().sort(function (a, b) {
      return STATE_ORDER[state(a)] - STATE_ORDER[state(b)] || a.start - b.start;
    });
    h += '<div class="section"><div class="section-head"><h2>Functions</h2><span class="note">dead and unverified first, then by line</span></div>' +
      '<div class="panel"><div class="tablewrap"><table class="cov"><thead><tr><th>Function</th><th>Mode</th><th class="num">Lines</th><th>State</th></tr></thead><tbody>';
    fns.forEach(function (fn) {
      var st = state(fn);
      h += '<tr><td class="name mono">' + (f.source ? '<a href="#L' + fn.start + '">' : '') + esc(fn.name) + (f.source ? '</a>' : '') +
        ' <span class="mode">' + esc(fn.path) + '</span></td>' +
        '<td><span class="mode">' + esc(fn.mode) + '</span></td>' +
        '<td class="num">' + fn.start + (fn.end > fn.start ? "–" + fn.end : "") + '</td>' +
        '<td><span class="state ' + st + '">' + STATE_LABEL[st] + '</span>' + (fn.dynamic ? ' <span class="muted">' + esc(fn.dynamic) + '</span>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div></div></div>';

    if (f.source === null) {
      h += '<p class="note">Source not found under ' + esc(DATA.src_root) + '; run with --src pointing at the directory the crate was compiled from.</p>';
      return h;
    }
    var lines = f.source.split("\n");
    if (lines.length && lines[lines.length - 1] === "") lines.pop();
    var mark = new Array(lines.length + 1);
    var painted = f.functions.slice().sort(function (a, b) { return (b.verified - a.verified) || (b.reachable - a.reachable); });
    painted.forEach(function (fn) {
      for (var l = fn.start; l <= fn.end && l <= lines.length; l++) if (!mark[l]) mark[l] = fn;
    });
    h += '<div class="section"><div class="section-head"><h2>Source</h2><span class="note">' + lines.length + ' lines</span></div><div class="panel src">';
    var hl = { block: false, str: false, raw: null };
    lines.forEach(function (text, i) {
      var n = i + 1, fn = mark[n], st = fn ? state(fn) : "";
      h += '<div class="ln ' + st + '" id="L' + n + '"' + (fn ? ' title="' + esc(fn.name) + ": " + STATE_LABEL[st] + '"' : "") + '>' +
        '<span class="n">' + n + '</span><span class="c">' + highlight(text, hl) + '</span></div>';
    });
    return h + '</div></div>';
  }
  // ---- Rust and Verus syntax, one line at a time; `st` carries block
  // comments and strings that continue onto the next line
  var RUST_KW = {};
  ("as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut " +
   "pub ref return self Self static struct super trait true type unsafe use where while").split(" ").forEach(function (k) { RUST_KW[k] = 1; });
  var VERUS_KW = {};
  ("spec proof exec requires ensures recommends returns invariant invariant_except_break decreases assert assume forall exists " +
   "choose ghost tracked broadcast by implies opens_invariants no_unwind int nat via trigger calc axiom uninterp reveal hide " +
   "invariant_ensures default_ensures unwind").split(" ").forEach(function (k) { VERUS_KW[k] = 1; });
  function tok(cls, text) { return '<span class="t-' + cls + '">' + esc(text) + '</span>'; }
  function highlight(line, st) {
    var out = "", i = 0, m, rest;
    while (i < line.length) {
      rest = line.slice(i);
      if (st.block) {
        var e = rest.indexOf("*/");
        if (e < 0) { out += tok("com", rest); break; }
        out += tok("com", rest.slice(0, e + 2)); i += e + 2; st.block = false; continue;
      }
      if (st.raw !== null) {
        var close = rest.indexOf('"' + st.raw);
        if (close < 0) { out += tok("str", rest); break; }
        out += tok("str", rest.slice(0, close + 1 + st.raw.length)); i += close + 1 + st.raw.length; st.raw = null; continue;
      }
      if (st.str) {
        m = /^(?:[^"\\]|\\.)*"/.exec(rest);
        if (!m) { out += tok("str", rest); break; }
        out += tok("str", m[0]); i += m[0].length; st.str = false; continue;
      }
      if (rest.slice(0, 2) === "//") { out += tok("com", rest); break; }
      if (rest.slice(0, 2) === "/*") { st.block = true; continue; }
      if ((m = /^b?r(#*)"/.exec(rest))) { st.raw = m[1]; out += tok("str", m[0]); i += m[0].length; continue; }
      if ((m = /^b?"(?:[^"\\]|\\.)*"/.exec(rest))) { out += tok("str", m[0]); i += m[0].length; continue; }
      if ((m = /^b?"/.exec(rest))) { st.str = true; out += tok("str", m[0]); i += m[0].length; continue; }
      if ((m = /^b?'(?:[^'\\]|\\.)'/.exec(rest))) { out += tok("str", m[0]); i += m[0].length; continue; }
      if ((m = /^'[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) { out += tok("lt", m[0]); i += m[0].length; continue; }
      if ((m = /^#!?\[[^\]]*\]?/.exec(rest))) { out += tok("attr", m[0]); i += m[0].length; continue; }
      if ((m = /^(?:0x[0-9a-fA-F_]+|0b[01_]+|0o[0-7_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?)(?:[iu](?:8|16|32|64|128|size)|f32|f64|int|nat)?/.exec(rest))) {
        out += tok("num", m[0]); i += m[0].length; continue;
      }
      if ((m = /^(open|closed)(?=\s+(?:spec|proof|exec)\b)/.exec(rest))) { out += tok("vk", m[0]); i += m[0].length; continue; }
      if ((m = /^[A-Za-z_][A-Za-z0-9_]*!?/.exec(rest))) {
        var w = m[0];
        if (w.slice(-1) === "!") out += tok("mac", w);
        else if (RUST_KW[w]) out += tok("kw", w);
        else if (VERUS_KW[w]) out += tok("vk", w);
        else if (/^[A-Z]/.test(w)) out += tok("ty", w);
        else out += esc(w);
        i += w.length; continue;
      }
      if ((m = /^(?:==>|<==>|=~=|=~~=|&&&|\|\|\|)/.exec(rest))) { out += tok("vk", m[0]); i += m[0].length; continue; }
      out += esc(rest[0]); i++;
    }
    return out;
  }
  function render() {
    document.getElementById("app").innerHTML = header() + (DATA.page === "file" ? viewFile() : viewFiles());
    document.querySelectorAll("button[data-scope]").forEach(function (b) {
      b.addEventListener("click", function () {
        scope = b.getAttribute("data-scope");
        try { localStorage.setItem("verus-reach-scope", scope); } catch (e) {}
        compute();
        render();
      });
    });
    document.querySelectorAll("th[data-key]").forEach(function (th) {
      var go = function () {
        var k = th.getAttribute("data-key");
        if (sort.key === k) sort.dir = -sort.dir; else { sort.key = k; sort.dir = k === "name" ? 1 : -1; }
        render();
      };
      th.addEventListener("click", go);
      th.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }
  render();
  if (location.hash) { var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({ block: "center" }); }
})();
</script>
